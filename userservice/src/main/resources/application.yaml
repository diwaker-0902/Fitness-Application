spring:
  application:
    name: userservice
  datasource:
    url: jdbc:mysql://localhost:3306/fitness-micro-user
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.MySQL8Dialect

eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/

    instance:
      hostname: localhost
      prefer-ip-address: false
    
server:
    port: 8081